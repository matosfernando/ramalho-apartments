name: Deploy to VPS

on:
  push:
    branches:
      - main
  # Hourly refresh of the availability calendar. The site is static, so booked
  # dates are baked into the HTML at build time and only change when we rebuild.
  # Offset from the hour because GitHub's scheduler is busiest exactly on it.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Without this the script runs every line regardless of failures and the
          # job still reports success. That is exactly what happened on
          # 2026-08-09: `git pull` aborted, the site was rebuilt from stale
          # source, and the run showed green.
          script_stop: true
          # Forward the iCal feed URL to the build. It stays a GitHub secret and
          # is never written to the server or the repo.
          envs: AIRBNB_ICAL_RAMALHO,TRIGGER
          script: |
            set -euo pipefail
            cd /srv/ramalho-apartments/site

            git fetch origin main

            # `npm install` rewrites package-lock.json on the server, which left
            # the working tree dirty and made every subsequent `git pull` abort
            # with "your local changes would be overwritten". Discard that one
            # generated file before merging. Using `npm ci` below stops it
            # recurring, so this is belt and braces.
            git checkout -- package-lock.json || true

            # Fast-forward only: if the server has diverged, fail loudly rather
            # than silently deploying something nobody wrote.
            git merge --ff-only origin/main

            echo "Deploying $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s) [${TRIGGER}]"

            # Dependencies cannot have changed on a scheduled rebuild, and `npm ci`
            # wipes and reinstalls node_modules every time. Skip it hourly.
            if [ "${TRIGGER}" != "schedule" ]; then
              npm ci
            fi

            # prebuild fetches the iCal feeds; a channel being unreachable falls
            # back to the previous data rather than failing the build.
            npm run build

            # nginx serves ./site/dist through a read-only bind mount, so new
            # files are live the moment the build finishes. A restart is only
            # needed when the container's own config could have changed, which
            # is on a real push — not on an hourly content refresh.
            if [ "${TRIGGER}" != "schedule" ]; then
              cd /srv/ramalho-apartments
              docker-compose restart
            fi
        env:
          AIRBNB_ICAL_RAMALHO: ${{ secrets.AIRBNB_ICAL_RAMALHO }}
          TRIGGER: ${{ github.event_name }}
