# nginx config for ramalhoapartments.com
#
# Replaces the stock default.conf that ships inside the nginx:alpine image.
# Mounted from this repo so server behaviour is version-controlled and ships
# with a normal deploy, instead of existing only on the VPS where nobody can
# review it.
#
# Caddy terminates TLS and reverse-proxies here over plain HTTP on the external
# `web` Docker network. That detail is the reason for absolute_redirect below.
#
# Mount it by adding this to the ramalho-static service in docker-compose.yml:
#
#   volumes:
#     - ./site/dist:/usr/share/nginx/html:ro
#     - ./site/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
#
# Volume changes need `docker compose up -d`, not `restart`.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Relative redirects ────────────────────────────────────────────────
    # Emit "Location: /properties/" rather than "Location: http://host/properties/".
    #
    # nginx redirects /properties to /properties/ so it can serve
    # /properties/index.html. By default it builds that redirect as an absolute
    # URL using $scheme — and because Caddy proxies to us over plain HTTP inside
    # Docker, $scheme is "http". So every non-root HTTPS request was answered
    # with an http:// redirect. Browsers survived it because Caddy bounced them
    # back to HTTPS, but crawlers that force HTTPS and strip trailing slashes
    # looped forever, which is the ERR_TOO_MANY_REDIRECTS an external crawl hit.
    #
    # A relative Location inherits whatever scheme and host the visitor actually
    # used, so it cannot downgrade the connection.
    absolute_redirect off;

    # ── Character encoding ────────────────────────────────────────────────
    # Without this, nginx sends "Content-Type: text/plain" with no charset and
    # browsers fall back to Latin-1, so any non-ASCII byte renders as mojibake.
    # charset_types is needed because nginx only applies the charset to
    # text/html by default.
    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/rss+xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
